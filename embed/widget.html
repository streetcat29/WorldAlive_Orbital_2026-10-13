<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>World Alive widget</title>
<style>
:root{--bg:#0b1220;--card:#0f1a2e;--tx:#eaf0ff;--tx2:#96a3c2;--tx3:#5f6d8c;--acc:#22d3ee;--acc2:#34d399;--line:rgba(255,255,255,.1);
--mono:"SF Mono",ui-monospace,"Cascadia Mono",Consolas,monospace}
html[data-theme=light]{--bg:#f5f7fb;--card:#fff;--tx:#0b1220;--tx2:#4b5675;--tx3:#8a94ad;--line:rgba(0,0,0,.09)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:transparent}
body{font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);display:flex}
a{color:inherit;text-decoration:none}
.w{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0;position:relative;overflow:hidden}
.w::before{content:"";position:absolute;inset:0;background:radial-gradient(500px 220px at 0% -20%,rgba(34,211,238,.14),transparent 60%);pointer-events:none}
.hd{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx2)}
.hd img{width:22px;height:auto;border-radius:3px}.hd b{color:var(--tx);letter-spacing:0;text-transform:none;font-size:13px}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--acc2);box-shadow:0 0 0 0 rgba(52,211,153,.7);animation:pl 1.8s infinite;flex:0 0 auto}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(52,211,153,.7)}70%{box-shadow:0 0 0 7px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.n{font:700 clamp(22px,7cqw,40px)/1.1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em;background:linear-gradient(92deg,var(--tx),var(--acc) 70%,var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.s{font-size:12px;color:var(--tx2)}.s b{color:var(--tx);font-family:var(--mono);font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--tx2)}.row span b{color:var(--tx);font-family:var(--mono)}
.ft{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:var(--tx3);padding-top:6px;border-top:1px solid var(--line)}
.ft a{color:var(--acc);font-weight:600}
.w.bar{flex-direction:row;align-items:center;gap:14px;padding:10px 14px}.w.bar .n{font-size:clamp(18px,4.5cqw,28px)}.w.bar .ft{margin:0 0 0 auto;border:0;padding:0;flex:0 0 auto;white-space:nowrap}.w.bar .ft span{display:none}.w.bar .row,.w.bar .s{display:none}.w.bar .hd{flex:0 0 auto;white-space:nowrap}
.w.tile{text-align:center;align-items:center}.w.tile .ft{width:100%;justify-content:center;gap:10px}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.cmp .n{font-size:clamp(16px,4.5cqw,26px)}.cmp .vs{font:700 14px var(--mono);color:var(--tx3)}.cmp .hd{justify-content:center}
.err{color:var(--tx2);font-size:12px}
body{container-type:inline-size}
</style><!-- WA-PRIVACY:v1 --><link rel="stylesheet" href="/privacy-consent.css?v=c4038f58653c"><script src="/privacy-consent.js?v=94da8f0fd313" defer></script><!-- /WA-PRIVACY:v1 --><!-- Google AdSense. Publisher: ca-pub-5319148883611867

</head><body>
<div class="w" id="w"><span class="err">Loading...</span></div>
<script>
(function(){
  var q=new URLSearchParams(location.search), type=q.get('type')||'world', iso=(q.get('iso')||'').toUpperCase(), city=q.get('city')||'', vs=(q.get('vs')||'').toUpperCase();
  var theme=q.get('theme')||'dark', size=q.get('size')||'card', base=location.origin;
  if(theme==='auto') theme=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
  document.documentElement.setAttribute('data-theme',theme);
  var W=document.getElementById('w'); W.className='w '+size; var nf=new Intl.NumberFormat('en-US'), YEAR_MS=365.2425*864e5;
  function pop(d,now){var e=d.a?Date.parse(d.a+'T00:00:00Z'):Date.UTC(d.y,6,1);return d.p*Math.exp((d.g||0)/100*(now-e)/YEAR_MS);}
  function sod(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();}
  function fl(d){return d.iso2&&/^[a-z]{2}$/i.test(d.iso2)?'<img src="'+base+'/flags/w40/'+d.iso2.toLowerCase()+'.png" alt="">':'';}
  function credit(u,d){return '<div class="ft"><span>live estimate · '+(d&&d.source?d.source:'World Bank')+'</span><a href="'+base+(u||'/')+'?utm_source=widget" target="_blank" rel="noopener">theworldalive.com ↗</a></div>';}
  function get(u){return fetch(base+'/embed/data/'+u+'.json').then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});}
  function fail(){W.innerHTML='<span class="err">World Alive widget: could not load data.</span>'+credit('/');}
  if(type==='compare'&&iso&&vs){
    Promise.all([get('countries/'+iso),get('countries/'+vs)]).then(function(ds){
      W.innerHTML='<div class="cmp"><div><div class="hd">'+fl(ds[0])+'<b>'+ds[0].n+'</b></div><div class="n" id="a"></div><div class="s">'+(ds[0].g>=0?'+':'−')+Math.abs(ds[0].g).toFixed(2)+'%/yr · #'+ds[0].rank+'</div></div><div class="vs">vs</div><div><div class="hd">'+fl(ds[1])+'<b>'+ds[1].n+'</b></div><div class="n" id="b"></div><div class="s">'+(ds[1].g>=0?'+':'−')+Math.abs(ds[1].g).toFixed(2)+'%/yr · #'+ds[1].rank+'</div></div></div>'+credit('/compare/#'+iso+'-vs-'+vs);
      var A=document.getElementById('a'),B=document.getElementById('b');
      (function t(){var now=Date.now();A.textContent=nf.format(Math.round(pop(ds[0],now)));B.textContent=nf.format(Math.round(pop(ds[1],now)));setTimeout(t,1000);})();
    }).catch(fail); return;
  }
  var u = type==='world'?'world': type==='city'?'cities/'+city : 'countries/'+iso;
  get(u).then(function(d){
    var label = type==='world'?'World population right now': type==='city'?(d.n+' · '+d.c):(d.n+' population');
    var extra = type==='city'?'<div class="s">'+d.k+' · '+(d.g>=0?'+':'−')+Math.abs(d.g).toFixed(2)+'% a year</div>'
              : '<div class="row">'+(d.br?'<span>births today <b id="bt"></b></span>':'')+(d.dr?'<span>deaths today <b id="dt"></b></span>':'')+'<span>net <b id="nt"></b></span>'+(d.rank?'<span>rank <b>#'+d.rank+'</b></span>':'')+'</div>';
    W.innerHTML='<div class="hd"><span class="pulse"></span>'+(type==='country'?fl(d):'')+'<b>'+label+'</b></div><div class="n" id="n"></div>'+extra+(d.source?'<div class="s">'+d.source+' · '+d.reference+' · Model anchor '+d.a+' · '+d.method+'</div>':'')+credit(d.u,d);
    var N=document.getElementById('n'),BT=document.getElementById('bt'),DT=document.getElementById('dt'),NT=document.getElementById('nt');
    (function t(){var now=Date.now(),p=pop(d,now),secs=(now-sod())/1000,ys=YEAR_MS/1000;N.textContent=nf.format(Math.round(p));
      if(BT)BT.textContent=nf.format(Math.round(p*d.br/1000/ys*secs));if(DT)DT.textContent=nf.format(Math.round(p*d.dr/1000/ys*secs));
      if(NT){var v=p*(d.g||0)/100/ys*secs;NT.textContent=(v>=0?'+':'−')+nf.format(Math.round(Math.abs(v)));}setTimeout(t,1000);})();
  }).catch(fail);
})();
</script></body></html>
